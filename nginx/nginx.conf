# zhian Nginx 反向代理配置（含 SSL）
# 用法：
#   1. 全新服务器首次 setup 时，deploy.sh 会把本文件复制到 /etc/nginx/conf.d/zhian.conf
#   2. 已用 certbot 配好证书的服务器，deploy.sh 不会覆盖（保留现有配置）
#   3. 修改后 nginx -t && systemctl reload nginx

# 80 端口：重定向到 443（HTTPS）
server {
    listen 80;
    server_name ralpractice.top www.ralpractice.top 8.130.208.205;

    return 301 https://$host$request_uri;
}

# 443 端口：HTTPS 主服务
server {
    listen 443 ssl;
    server_name ralpractice.top www.ralpractice.top 8.130.208.205;

    ssl_certificate     /etc/letsencrypt/live/ralpractice.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ralpractice.top/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;

    # 前端静态资源（npm run build 产物）
    root /var/www/zhian/dist;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
    }

    # API 反向代理到后端服务（uvicorn）
    location /api/ {
        # 注意：结尾不要加斜杠，保留 /api 前缀转发给 FastAPI
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA 前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
