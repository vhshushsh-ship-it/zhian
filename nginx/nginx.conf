# login-demo Nginx 反向代理配置
# 用法：
#   1. 复制本文件到服务器 /etc/nginx/conf.d/login-demo.conf
#   2. 修改 server_name 与 root 路径
#   3. nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name rajpractice.top www.rajpractice.top 8.130.208.205;        # 改成你的域名或服务器 IP

    # 前端静态资源（npm run build 产物）
    root /var/www/login-demo/dist;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 带 hash 的静态资源长缓存
    location /assets/ {
        expires 30d;
    }

    # API 反向代理到后端服务（uvicorn）
    location /api/ {
        # 注意：结尾不要加斜杠，保留 /api 前缀转发给 FastAPI
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # SPA 前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
